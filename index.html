<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Hustle — Street Royale · Engine v3 (Phaser)</title>
<style>
body{margin:0;background:#060503;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
</style>
</head>
<body>

<div id="dhx">
<style>
#dhx{--pink:#e0a81c;--cyan:#4189dd;--gold:#ffd166;--green:#5dbb63;--red:#e05252;--cab1:#221a08;--cab2:#0b0906;--frame:#6b5316;--tile1:#241b0c;--tile2:#0f0c06;--line:rgba(255,209,102,.16);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;max-width:660px;margin:0 auto;position:relative}
#dhx button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
#dhx .cab{position:relative;background:radial-gradient(130% 90% at 50% 0%,var(--cab1) 0%,var(--cab2) 60%);border:2px solid var(--frame);border-radius:18px;padding:12px 12px 14px;box-shadow:0 0 26px rgba(0,0,0,.6),0 0 24px color-mix(in srgb,var(--gold) 14%,transparent),inset 0 0 40px rgba(0,0,0,.55);overflow:hidden}
#dhx .cab.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
#dhx .glowa,#dhx .glowb{position:absolute;width:280px;height:280px;border-radius:50%;filter:blur(75px);opacity:.22;pointer-events:none}
#dhx .glowa{background:var(--gold);top:-90px;left:-70px;animation:drift 9s ease-in-out infinite alternate}
#dhx .glowb{background:var(--cyan);bottom:-110px;right:-60px;animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.15)}}
#dhx .jackpots{display:flex;gap:8px;justify-content:center;position:relative}
#dhx .jp{flex:1;text-align:center;border:1px solid var(--frame);border-radius:10px;padding:4px 4px 5px;background:linear-gradient(180deg,rgba(255,209,102,.06),rgba(0,0,0,.2))}
#dhx .jp .l{font-size:10px;letter-spacing:.16em;color:#b9a06a}
#dhx .jp .v{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#dhx .jp.grand .v{color:var(--gold);text-shadow:0 0 10px color-mix(in srgb,var(--gold) 80%,transparent)}
#dhx .jp.major .v{color:var(--pink);text-shadow:0 0 10px color-mix(in srgb,var(--pink) 70%,transparent)}
#dhx .jp.mini .v{color:var(--cyan);text-shadow:0 0 10px color-mix(in srgb,var(--cyan) 70%,transparent)}
#dhx .title{text-align:center;margin:12px 0 8px;position:relative}
#dhx .title h1{display:inline-block;margin:0;font-size:37px;font-weight:500;font-style:italic;letter-spacing:.02em;transform:skew(-6deg) rotate(-1.5deg);background:linear-gradient(180deg,#fff7d6 5%,#ffd166 45%,#a97a10 92%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.9)) drop-shadow(0 0 18px color-mix(in srgb,var(--gold) 45%,transparent));animation:glowpulse 3.5s ease-in-out infinite}
#dhx .title .sub{display:block;font-size:14px;font-weight:500;font-style:italic;letter-spacing:.42em;color:#fff;transform:skew(-6deg);text-shadow:1px 1px 0 #000,0 0 8px rgba(255,255,255,.35);margin-top:0}
@keyframes glowpulse{0%,100%{filter:drop-shadow(2px 3px 0 rgba(0,0,0,.9)) drop-shadow(0 0 14px color-mix(in srgb,var(--gold) 35%,transparent))}50%{filter:drop-shadow(2px 3px 0 rgba(0,0,0,.9)) drop-shadow(0 0 26px color-mix(in srgb,var(--gold) 65%,transparent))}}
#dhx .bulbs{display:flex;justify-content:space-between;margin:8px 2px 0;padding:0 6px}
#dhx .bulb{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:bulb 1s infinite}
#dhx .bulb:nth-child(even){background:#fff;box-shadow:0 0 8px #fff}
@keyframes bulb{0%,100%{opacity:1}50%{opacity:.15}}
#dhx .reelwrap{position:relative;margin-top:6px;border:2px solid var(--frame);border-radius:14px;padding:10px;background:#0a0805;box-shadow:inset 0 0 30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,220,140,.12)}
#dhx .reels{display:flex;gap:8px;justify-content:center;position:relative}
#dhx .reel{width:104px;height:204px;overflow:hidden;border-radius:12px;position:relative}
#dhx .reel.antic{border:1px solid var(--gold);box-shadow:0 0 16px color-mix(in srgb,var(--gold) 70%,transparent);animation:anticp .5s infinite}
@keyframes anticp{50%{box-shadow:0 0 28px var(--gold)}}
#dhx .reel.cresc{border:2px solid var(--gold);box-shadow:0 0 22px color-mix(in srgb,var(--gold) 80%,transparent),inset 0 0 18px color-mix(in srgb,var(--gold) 25%,transparent);animation:crescp .32s infinite}
@keyframes crescp{50%{box-shadow:0 0 44px var(--gold),inset 0 0 30px color-mix(in srgb,var(--gold) 40%,transparent)}}
#dhx .cell img{display:block}
#dhx .strip{will-change:transform}
#dhx .strip.moving{filter:blur(1.6px) brightness(1.15)}
#dhx .cell{height:60px;margin:4px;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;border-radius:10px;border:1px solid #7a5f18;background:radial-gradient(120% 100% at 50% 28%,var(--tile1),var(--tile2) 72%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),inset 0 2px 8px color-mix(in srgb,var(--gold) 7%,transparent),0 2px 4px rgba(0,0,0,.45)}
#dhx .cell.win{animation:hop .5s ease 2}
#dhx .cell.win::after{content:"";position:absolute;inset:-2px;border-radius:12px;border:2px solid var(--gold);box-shadow:0 0 16px var(--gold),inset 0 0 10px color-mix(in srgb,var(--gold) 55%,transparent);animation:hop .5s ease 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px) scale(1.06)}}
#dhx .winlines{position:absolute;inset:10px;pointer-events:none}
#dhx .banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;z-index:5}
#dhx .banner.show{opacity:1}
#dhx .banner .big{font-size:34px;font-weight:500;font-style:italic;letter-spacing:.06em;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
#dhx .banner .amt{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;margin-top:2px}
#dhx .banner.gold .big{color:var(--gold);text-shadow:0 0 12px var(--gold),0 0 40px color-mix(in srgb,var(--gold) 70%,transparent),2px 2px 0 #000}
#dhx .banner.gold .amt{color:#fff;text-shadow:0 0 10px var(--gold)}
#dhx .banner.cyan .big{color:#9cc4f0;text-shadow:0 0 12px var(--cyan),2px 2px 0 #000}
#dhx .banner.red .big{color:var(--red);text-shadow:0 0 12px var(--red),2px 2px 0 #000;animation:pop .6s cubic-bezier(.2,1.6,.4,1),flash .4s 3}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes flash{50%{opacity:.2}}
#dhx .soclose{position:absolute;left:0;right:0;top:12px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5}
#dhx .soclose.show{opacity:1}
#dhx .soclose span{display:inline-block;font-size:15px;font-weight:500;letter-spacing:.2em;color:#fff;background:color-mix(in srgb,var(--red) 30%,transparent);border:1px solid var(--red);border-radius:999px;padding:4px 16px;text-shadow:0 0 8px var(--red);box-shadow:0 0 16px color-mix(in srgb,var(--red) 55%,transparent)}
#dhx .stats{display:flex;gap:6px;margin-top:10px;align-items:center}
#dhx .stat{flex:1;border:1px solid var(--frame);border-radius:10px;padding:4px 6px;background:linear-gradient(180deg,rgba(255,209,102,.05),rgba(0,0,0,.25));text-align:center}
#dhx .stat .k{font-size:9px;letter-spacing:.14em;color:#b9a06a}
#dhx .stat .v{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:#ffe9b0}
#dhx .pill{font-size:11px;border:1px solid var(--frame);border-radius:999px;padding:7px 11px;background:#0d0a05;color:#cbb277;letter-spacing:.08em;transition:all .15s;white-space:nowrap}
#dhx .pill:hover{border-color:var(--gold);color:var(--gold)}
#dhx .pill.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px color-mix(in srgb,var(--gold) 45%,transparent)}
#dhx .ctrlbar{display:flex;align-items:center;gap:6px;margin-top:10px;background:linear-gradient(180deg,#241c0d,#110d06);border:1px solid var(--frame);border-radius:16px;padding:9px 10px;box-shadow:inset 0 1px 0 rgba(255,220,140,.14),0 4px 14px rgba(0,0,0,.5)}
#dhx .barbtn{width:34px;height:40px;border-radius:10px;border:1px solid #55430f;background:#0d0a05;color:var(--gold);font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
#dhx .barbtn:hover{border-color:var(--gold)}
#dhx .baritem{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #55430f;border-radius:10px;background:#0d0a05;padding:4px 10px;min-width:0}
#dhx .baritem .lab{font-size:8.5px;letter-spacing:.14em;color:#9c8b5e;white-space:nowrap}
#dhx .baritem .val{font-size:14px;font-weight:500;color:var(--gold);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap}
#dhx .betctl{display:flex;align-items:center;gap:4px}
#dhx .betctl button{width:26px;height:26px;border-radius:50%;background:#1d1608;color:var(--gold);font-size:15px;display:flex;align-items:center;justify-content:center;border:1px solid #55430f}
#dhx .betctl button:hover{border-color:var(--gold)}
#dhx .spingroup{flex:1;display:flex;justify-content:center}
#dhx .spin{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffe9a3,var(--gold) 52%,#8a650f);color:#3a2a00;font-size:30px;box-shadow:0 0 0 4px #3a2c08,0 0 22px color-mix(in srgb,var(--gold) 55%,transparent),inset 0 -5px 9px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.5);transition:transform .12s,box-shadow .12s;display:flex;align-items:center;justify-content:center;margin:-18px 2px -14px}
#dhx .spin:hover{transform:scale(1.06)}
#dhx .spin:active{transform:scale(.93)}
#dhx .spin:disabled{opacity:.6;cursor:default}
#dhx .spin.hype{animation:hypep 1s infinite}
@keyframes hypep{0%,100%{box-shadow:0 0 0 4px #3a2c08,0 0 22px color-mix(in srgb,var(--gold) 55%,transparent)}50%{box-shadow:0 0 0 6px #3a2c08,0 0 44px var(--gold)}}
#dhx .ladder{display:flex;gap:4px;margin-top:10px;align-items:center}
#dhx .ladder .lab{font-size:10px;color:#9c8b5e;margin-right:6px;letter-spacing:.08em}
#dhx .chip{flex:1;text-align:center;font-size:11px;padding:4px 0;border-radius:6px;border:1px solid #55430f;color:#7d6a3d;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;transition:all .2s}
#dhx .chip.on{background:linear-gradient(180deg,#ffe9a3,#d99e12);color:#3a2a00;border-color:var(--gold);box-shadow:0 0 10px color-mix(in srgb,var(--gold) 60%,transparent);font-weight:500}
#dhx .hypewrap{margin-top:8px;display:flex;align-items:center;gap:8px}
#dhx .hypewrap .lab{font-size:10px;color:#9c8b5e;letter-spacing:.1em;white-space:nowrap}
#dhx .hypebar{flex:1;height:9px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid #55430f;overflow:hidden}
#dhx .hypefill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--cyan));box-shadow:0 0 12px color-mix(in srgb,var(--gold) 70%,transparent);transition:width .4s}
#dhx .hypebar.full .hypefill{animation:hypesh 1s infinite}
@keyframes hypesh{50%{filter:brightness(1.6)}}
#dhx .fsbadge{display:none;position:absolute;top:60px;right:18px;z-index:6;background:color-mix(in srgb,var(--cyan) 18%,transparent);border:1px solid var(--cyan);color:#bcd8f5;border-radius:999px;padding:4px 12px;font-size:12px;letter-spacing:.08em;box-shadow:0 0 14px color-mix(in srgb,var(--cyan) 40%,transparent)}
#dhx .fsbadge.show{display:block;animation:flash 1s infinite}
#dhx .toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(10px);background:rgba(16,12,4,.96);border:1px solid var(--frame);border-radius:999px;padding:6px 16px;font-size:12px;color:#ffe9b0;opacity:0;transition:all .3s;pointer-events:none;z-index:40;white-space:nowrap}
#dhx .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#dhx .overlay{position:absolute;inset:0;background:rgba(8,6,2,.92);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:30;border-radius:16px}
#dhx .overlay.show{display:flex}
#dhx .overlay h2{margin:0 0 8px;font-size:24px;font-weight:500;font-style:italic;color:var(--gold);text-shadow:0 0 16px color-mix(in srgb,var(--gold) 60%,transparent)}
#dhx .overlay p{margin:4px 0;color:#d8c79a;font-size:14px}
#dhx .overlay .cta{margin-top:12px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:9px 22px;font-size:14px;letter-spacing:.1em;box-shadow:0 0 14px color-mix(in srgb,var(--gold) 30%,transparent)}
#dhx .overlay .cta:hover{background:color-mix(in srgb,var(--gold) 12%,transparent)}
#dhx .wheelbox{position:relative;width:240px;height:240px;margin:10px 0}
#dhx .wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--gold);box-shadow:0 0 30px color-mix(in srgb,var(--gold) 50%,transparent),inset 0 0 40px rgba(0,0,0,.6);position:relative;transition:transform 4s cubic-bezier(.12,.8,.08,1)}
#dhx .wheel .seg{position:absolute;left:50%;top:50%;transform-origin:0 0;font-size:13px;font-weight:500;letter-spacing:.06em}
#dhx .pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid #fff;filter:drop-shadow(0 0 6px var(--gold));z-index:2}
#dhx .gift{position:absolute;top:10px;left:14px;z-index:6;font-size:12px;border:1px solid var(--green);color:var(--green);border-radius:999px;padding:4px 10px;background:color-mix(in srgb,var(--green) 8%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--green) 35%,transparent);animation:flash 1.2s infinite}
#dhx .payhint{margin-top:8px;font-size:10.5px;color:#8a7647;text-align:center;letter-spacing:.04em}
#dhx .doors{display:flex;gap:12px;margin:14px 6px 0}
#dhx .door{flex:1;border:1px solid var(--frame);border-radius:14px;padding:18px 8px 14px;text-align:center;background:linear-gradient(180deg,rgba(255,209,102,.05),rgba(0,0,0,.3));transition:all .2s}
#dhx .door:hover{border-color:var(--gold);box-shadow:0 0 20px color-mix(in srgb,var(--gold) 40%,transparent);transform:translateY(-5px)}
#dhx .door .de{font-size:36px;animation:hop 1.4s ease infinite}
#dhx .door .dn{font-size:12.5px;font-weight:500;margin-top:8px;color:var(--gold);letter-spacing:.08em}
#dhx .door .dt{font-size:10.5px;color:#9c8b5e;margin-top:3px}
#dhx .tile{border:1px solid #7a5f18;border-radius:10px;background:radial-gradient(120% 100% at 50% 28%,var(--tile1),var(--tile2) 72%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),0 2px 4px rgba(0,0,0,.45)}
#dhx .vgrid{display:grid;grid-template-columns:repeat(5,54px);gap:6px;margin:12px 0 4px}
#dhx .vcell{width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative}
#dhx .vcell.coin{border-color:var(--gold);box-shadow:0 0 12px color-mix(in srgb,var(--gold) 55%,transparent);animation:coinpop .45s cubic-bezier(.2,1.6,.4,1)}
#dhx .vcell .cv{position:absolute;bottom:2px;right:4px;font-size:9px;color:var(--gold);font-weight:500}
@keyframes coinpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
#dhx .agrid{display:grid;grid-template-columns:repeat(3,72px);gap:8px;margin:12px 0 4px}
#dhx .atile{width:72px;height:72px;font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .15s}
#dhx .atile:hover:not(.open){border-color:var(--gold);box-shadow:0 0 12px color-mix(in srgb,var(--gold) 40%,transparent)}
#dhx .atile.open{animation:coinpop .45s cubic-bezier(.2,1.6,.4,1);border-color:var(--gold)}
#dhx .atile .av{font-size:10px;color:var(--gold);margin-top:2px;font-weight:500}
#dhx .mpath{display:flex;gap:5px;margin:56px 8px 16px;position:relative}
#dhx .mnode{flex:1;text-align:center;font-size:11px;padding:8px 0;border-radius:8px;border:1px solid #55430f;color:#7d6a3d;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;transition:all .25s}
#dhx .mnode.done{border-color:var(--green);color:var(--green);box-shadow:0 0 10px color-mix(in srgb,var(--green) 35%,transparent)}
#dhx .mnode.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px color-mix(in srgb,var(--gold) 70%,transparent);transform:scale(1.14)}
#dhx .mnode.dead{border-color:var(--red);color:var(--red);box-shadow:0 0 12px color-mix(in srgb,var(--red) 60%,transparent)}
#dhx .mrocket{position:absolute;top:-48px;left:0;font-size:32px;transition:left .55s cubic-bezier(.3,1.3,.4,1),transform .35s;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--cyan) 60%,transparent))}
#dhx .mrocket.crash{transform:translateY(34px) rotate(105deg);filter:grayscale(1) drop-shadow(0 0 8px var(--red))}
#dhx .cashout{border:1px solid var(--green);color:var(--green);border-radius:999px;padding:10px 26px;font-size:15px;font-weight:500;letter-spacing:.08em;box-shadow:0 0 16px color-mix(in srgb,var(--green) 40%,transparent);animation:cashp 1s infinite}
#dhx .cashout:hover:not(:disabled){background:color-mix(in srgb,var(--green) 12%,transparent)}
#dhx .cashout:disabled{opacity:.3;animation:none;cursor:default}
@keyframes cashp{50%{box-shadow:0 0 32px var(--green)}}
#dhx .bonusstats{font-size:13.5px;color:#ffe9b0;min-height:22px;margin-top:8px}
#dhx .paytable{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto;margin:10px 14px 4px;padding-right:4px;width:calc(100% - 28px);box-sizing:border-box}
#dhx .prow{display:flex;align-items:center;gap:10px;border:1px solid #55430f;border-radius:10px;padding:6px 10px;background:#0d0a05}
#dhx .prow .pe{font-size:24px;width:34px;text-align:center}
#dhx .prow .pn{flex:1;font-size:12px;color:#d8c79a;letter-spacing:.06em;text-transform:capitalize}
#dhx .prow .pp{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#dhx .setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 14px 0;width:calc(100% - 28px);box-sizing:border-box}
#dhx .setrow .sl{font-size:10px;letter-spacing:.14em;color:#b9a06a}
#dhx .schemes{display:flex;gap:6px}
#dhx #payOverlay{justify-content:flex-start;overflow:auto;padding:26px 0 18px}
#dhx .reelwrap{height:224px}
#dhx #reelwrap canvas{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:1;border-radius:12px}
#dhx .winlines{z-index:2}
</style>

<div class="cab" id="cab">
  <div class="glowa"></div><div class="glowb"></div>
  <canvas id="fx" style="position:absolute;inset:0;pointer-events:none;z-index:35"></canvas>
  <div class="jackpots" id="jackpots"></div>
  <button class="gift" id="giftBtn" style="display:none"></button>
  <div class="title"><h1 id="gameTitle"></h1><span class="sub" id="gameSub"></span></div>
  <div class="bulbs" id="bulbs"></div>
  <div class="reelwrap">
    
    <svg class="winlines" id="winlines"></svg>
    <div class="soclose" id="soclose"><span></span></div>
    <div class="banner" id="banner"><div class="big"></div><div class="amt"></div></div>
  </div>
  <div class="fsbadge" id="fsbadge"></div>
  <div class="ladder" id="ladder"><span class="lab" id="ladderLab"></span></div>
  <div class="hypewrap"><span class="lab" id="hypeLab"></span><div class="hypebar" id="hypebar"><div class="hypefill" id="hypefill"></div></div></div>
  <div class="stats">
    <div class="stat"><div class="k">SPINS</div><div class="v" id="spinVal"></div></div>
    <div class="stat"><div class="k">BIGGEST</div><div class="v" id="bigVal"></div></div>
    <div class="stat"><div class="k">BONUS</div><div class="v" id="bonusVal"></div></div>
    <div class="stat"><div class="k">SESSION</div><div class="v" id="timeVal">0:00</div></div>
    <button class="pill" id="turboBtn">Turbo</button>
  </div>
  <div class="ctrlbar">

<script>
/* audio.js — synth SFX, sound schemes, music bed, haptics */
(function(){
var CFG=GH.CFG;
var AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,type,v,when,slide){
  if(GH.state.muted||!CFG.audio.enabled)return; var a=ac(); if(!a)return;
  var o=a.createOscillator(),g=a.createGain(); o.type=type||'square';
  var t=a.currentTime+(when||0);
  o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime((v||0.06)*CFG.audio.volume,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.02);
}
function curScheme(){ return CFG.audio.schemes[GH.state.scheme]||CFG.audio.schemes[Object.keys(CFG.audio.schemes)[0]]; }
function semiF(base,semi){ return base*Math.pow(2,semi/12); }

GH.audio={
  ac:ac,
  spin:function(){tone(180,0.5,'sawtooth',0.03,0,420)},
  stop:function(){tone(140,0.12,'square',0.08);tone(90,0.15,'sine',0.1)},
  tick:function(){tone(1200,0.03,'square',0.02)},
  jiggle:function(n){var s=curScheme();for(var i=0;i<n;i++){var semi=s.scale[i%s.scale.length]+12*Math.floor(i/s.scale.length);tone(semiF(s.base,semi),0.16,s.wave,0.07,i*s.tempo)}},
  chord:function(when){var s=curScheme();[0,4,7,12].forEach(function(st,i){tone(semiF(s.base,st),0.8,s.wave,0.045,(when||0)+i*0.03)})},
  win:function(){GH.audio.jiggle(4)},
  nice:function(){GH.audio.jiggle(6)},
  big:function(){var s=curScheme();GH.audio.jiggle(8);GH.audio.chord(8*s.tempo)},
  fanfare:function(){var s=curScheme();GH.audio.jiggle(12);GH.audio.chord(12*s.tempo)},
  coin:function(){var s=curScheme();tone(s.coin[0],0.08,s.wave,0.04);tone(s.coin[1],0.12,s.wave,0.04,0.07)},
  wah:function(){tone(420,0.55,'sawtooth',0.05,0,110)},
  heart:function(){tone(70,0.1,'sine',0.12);tone(70,0.1,'sine',0.1,0.18)},
  rise:function(step){var s=curScheme();var semi=s.scale[step%s.scale.length]+12*Math.floor(step/s.scale.length);tone(semiF(s.base,semi),0.14,s.wave,0.07)},
  suspense:function(k,n,tier){
    var s=curScheme(), f0=s.base*0.5, f1=s.base*4, p=k/(n-1), f=f0+(f1-f0)*p, vol=0.02+0.055*p;
    tone(f,0.34,'sawtooth',vol); tone(f*1.5,0.3,'triangle',vol*0.6,0.02);
    if(tier.level>=2)tone(70,0.09,'sine',0.10+0.06*p);
    if(k===n-1){tone(f1,0.75,'sawtooth',0.07,0,f1*1.6);GH.audio.chord(0.18)}
  }
};

/* ambient bass loop */
var musicTimer=null,mStepN=0;
GH.startMusic=function(){
  if(musicTimer||!CFG.audio.music)return;
  musicTimer=setInterval(function(){
    if(GH.state.muted||!CFG.audio.enabled)return;
    var s=curScheme(), b=s.bass[mStepN%s.bass.length];
    if(b>=0)tone(semiF(s.bassBase,b),0.26,'sine',0.045);
    if(s.hat&&mStepN%2===0)tone(6800,0.02,'square',0.005);
    mStepN++;
  },140);
};

/* haptics */
GH.buzz=function(name){
  if(!CFG.haptics.enabled||!navigator.vibrate)return;
  try{var p=CFG.haptics.patterns[name]; if(p)navigator.vibrate(p)}catch(e){}
};
})();
</script>
<script>
/* engine.js — pure slot math: strips, planning, evaluation, suspense detection.
   No rendering in here; game.js drives the visuals. */
(function(){
var CFG=GH.CFG;
GH.SYM={}; CFG.symbols.forEach(function(s){GH.SYM[s.key]=s});
GH.WILD=(CFG.symbols.filter(function(s){return s.wild})[0]||{}).key;
GH.RC=CFG.reels.count; GH.ROWS=CFG.reels.rows; GH.CH=CFG.reels.cellHeight;
GH.LINES=CFG.reels.lines; GH.LADDER=CFG.streak.ladder;
GH.STRIPLEN=CFG.symbols.reduce(function(a,s){return a+s.weight},0);

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
GH.buildStrip=function(seed){
  var r=mulberry(seed),pool=[];
  CFG.symbols.forEach(function(s){for(var i=0;i<s.weight;i++)pool.push(s.key)});
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t}
  var topKeys=CFG.symbols.slice(0,2).map(function(s){return s.key});
  for(var k=0;k<GH.STRIPLEN;k++){
    if(pool[k]==='rocket'){
      var a=(k+1)%GH.STRIPLEN,bb=(k-1+GH.STRIPLEN)%GH.STRIPLEN;
      if(topKeys.indexOf(pool[a])>=0){for(var m=0;m<GH.STRIPLEN;m++){if(pool[m]==='banana'){var tt=pool[m];pool[m]=pool[a];pool[a]=tt;break}}}
      if(topKeys.indexOf(pool[bb])>=0){for(var n=0;n<GH.STRIPLEN;n++){if(pool[n]==='dog'){var t2=pool[n];pool[n]=pool[bb];pool[bb]=t2;break}}}
    }
  }
  return pool;
};

GH.findIdx=function(st,mid){var c=[];for(var i=0;i<GH.STRIPLEN;i++){if(st[(i+1)%GH.STRIPLEN]===mid)c.push(i)}return c.length?c[Math.floor(Math.random()*c.length)]:Math.floor(Math.random()*GH.STRIPLEN)};
GH.findMiss=function(st,sym){var c=[];for(var i=0;i<GH.STRIPLEN;i++){if(st[(i+1)%GH.STRIPLEN]!==sym)c.push(i)}return c.length?c[Math.floor(Math.random()*c.length)]:Math.floor(Math.random()*GH.STRIPLEN)};
GH.findNearEdge=function(st,sym){var c=[];for(var i=0;i<GH.STRIPLEN;i++){if(st[(i+1)%GH.STRIPLEN]===sym)continue;if(st[i%GH.STRIPLEN]===sym||st[(i+2)%GH.STRIPLEN]===sym)c.push(i)}return c.length?c[Math.floor(Math.random()*c.length)]:GH.findMiss(st,sym)};
GH.idxAfter=function(st,sym){var c=[];for(var i=0;i<GH.STRIPLEN;i++){if(st[i]===sym&&st[(i+1)%GH.STRIPLEN]!==sym)c.push(i)}if(!c.length)return GH.findIdx(st,sym);return (c[Math.floor(Math.random()*c.length)]+1)%GH.STRIPLEN};

var curTease=null;
GH.plan=function(){
  var mids=[];for(var c=0;c<GH.RC;c++)mids.push(null);
  var r=Math.random();
  if(GH.state.hype>=CFG.hype.max){
    for(var c2=0;c2<CFG.hype.forcedRunLength;c2++)mids[c2]=CFG.hype.forcedSymbol;
    return{mids:mids,mode:'hype'};
  }
  var acc=0;
  for(var t=0;t<CFG.teases.length;t++){
    var tz=CFG.teases[t];acc+=tz.prob;
    if(r<acc){ tz.cols.forEach(function(c){mids[c]=tz.symbol}); mids[GH.RC-1]='NEAR:'+tz.symbol; curTease=tz; return{mids:mids,mode:tz.mode}; }
  }
  curTease=null;
  return{mids:mids,mode:'normal'};
};
GH.curTease=function(){return curTease};
GH.targetFor=function(c,pl,strips){
  var mid=pl.mids[c];
  if(mid&&mid.indexOf('NEAR:')===0){var nk=mid.slice(5);return curTease.near==='edge'?GH.findNearEdge(strips[c],nk):GH.findMiss(strips[c],nk)}
  if(pl.mode==='hype'&&c===GH.RC-1)return GH.idxAfter(strips[c],CFG.hype.forcedSymbol);
  if(mid)return GH.findIdx(strips[c],mid);
  return Math.floor(Math.random()*GH.STRIPLEN);
};

GH.gridFrom=function(src,strips){
  var grid=[];
  for(var c=0;c<GH.RC;c++){
    var p=((src[c]%GH.STRIPLEN)+GH.STRIPLEN)%GH.STRIPLEN,col=[];
    for(var r=0;r<GH.ROWS;r++)col.push(strips[c][(p+r)%GH.STRIPLEN]);
    grid.push(col);
  }
  return grid;
};

GH.evaluate=function(grid){
  var total=0,linesWin=[],wheel=false,bet=GH.state.bet;
  GH.LINES.forEach(function(ln){
    var sym=null,count=0;
    for(var c=0;c<GH.RC;c++){
      var s=grid[c][ln[c]];
      if(sym===null){if(s!==GH.WILD){sym=s;count++}}
      else{if(s===sym||s===GH.WILD)count++;else break}
    }
    if(sym===null){sym=GH.WILD;count=GH.RC}
    if(GH.SYM[sym].pay&&count>=3){
      total+=bet*GH.SYM[sym].pay[count];
      var cells=[];for(var c2=0;c2<count;c2++)cells.push({c:c2,r:ln[c2]});
      linesWin.push({sym:sym,count:count,cells:cells});
      if(count===GH.RC&&sym===GH.WILD)wheel=true;
    }
  });
  var sc=0,st=0;
  for(var c3=0;c3<GH.RC;c3++)for(var r3=0;r3<GH.ROWS;r3++){
    if(grid[c3][r3]===CFG.freeSpins.scatter)sc++;
    if(grid[c3][r3]===CFG.bonus.scatter)st++;
  }
  return{total:total,lines:linesWin,scatters:sc,stars:st,wheel:wheel,grid:grid};
};

GH.detect=function(grid,pl){
  var res=GH.evaluate(grid), ratio=res.total/GH.state.bet;
  if(res.wheel)return{tier:'jackpot',level:3};
  if(ratio>=CFG.suspense.bigRatio)return{tier:'big',level:3};
  if(res.scatters>=3||res.stars>=3)return{tier:'feature',level:2};
  if(ratio>=CFG.suspense.minRatio)return{tier:'run',level:1};
  if(pl.mode!=='normal')return{tier:'tease',level:1};
  return null;
};
})();
</script>

/* DOM particle fx (unchanged from v2 — canvas 2D confetti) */
var ctx=el.fx.getContext('2d'),parts=[],fxOn=false;
function fxResize(){var r=el.cab.getBoundingClientRect();el.fx.width=r.width;el.fx.height=r.height}
fxResize(); window.addEventListener('resize',fxResize);
function burst(x,y,n,cols){for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*9,vy:-Math.random()*9-3,g:0.25,s:Math.random()*5+3,c:cols[i%cols.length],r:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.3,life:1})}
function rain(n){var cols=[CFG.colors.gold,CFG.colors.pink,CFG.colors.cyan,CFG.colors.green,'#fff'];for(var i=0;i<n;i++)parts.push({x:Math.random()*el.fx.width,y:-10-Math.random()*80,vx:(Math.random()-0.5)*2,vy:Math.random()*3+2,g:0.05,s:Math.random()*6+4,c:cols[i%5],r:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.2,life:1})}
function fxLoop(){
  if(!parts.length){fxOn=false;ctx.clearRect(0,0,el.fx.width,el.fx.height);return}
  fxOn=true;ctx.clearRect(0,0,el.fx.width,el.fx.height);
  parts=parts.filter(function(p){return p.life>0&&p.y<el.fx.height+20});
  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.life-=0.008;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore()});
  requestAnimationFrame(fxLoop);
}
function fxKick(){if(!fxOn)requestAnimationFrame(fxLoop)}
function centerBurst(n){var r=el.reelwrap.getBoundingClientRect(),c=el.cab.getBoundingClientRect();burst(r.left-c.left+r.width/2,r.top-c.top+r.height/2,n,[CFG.colors.gold,CFG.colors.pink,CFG.colors.cyan,CFG.colors.green,'#fff'])}

/* ══════════════ PHASER REEL SCENE ══════════════ */
var RW=CFG.reels.reelW, GAP=CFG.reels.gap, TILE=CFG.reels.tile;
var SCENE_W=RC*RW+(RC-1)*GAP, SCENE_H=ROWS*CH;
GH.reelCont=[]; GH.anticFx=[]; GH.crescFx=[]; GH.pulseTweens=[];

function BootScene(){}
BootScene.prototype={
  preload:function(){
    var t=this;
    CFG.symbols.forEach(function(s){ t.load.image(s.tex,(GH.IMG64&&GH.IMG64[s.tex])||('assets/symbols/'+s.tex+'.png')); });
  },
  create:function(){
    var g=this.make.graphics({x:0,y:0,add:false});
    g.lineStyle(3,0xff4d5e,1); g.strokeRoundedRect(3,3,RW-6,SCENE_H-6,12); g.generateTexture('anticFrame',RW,SCENE_H); g.clear();
    g.lineStyle(5,0xffd166,1); g.strokeRoundedRect(4,4,RW-8,SCENE_H-8,12); g.generateTexture('crescFrame',RW,SCENE_H); g.clear();
    g.lineStyle(4,0xffd166,1); g.strokeRoundedRect(3,3,TILE-6,TILE-6,10); g.generateTexture('winFrame',TILE,TILE);
    this.scene.start('Main');
  }
};

function MainScene(){}
MainScene.prototype={
  create:function(){
    GH.main=this;
    var t=this;
    for(var c=0;c<RC;c++){
      var mx=this.make.graphics({add:false});
      mx.fillStyle(0xffffff); mx.fillRect(c*(RW+GAP),0,RW,SCENE_H);
      var mask=mx.createGeometryMask();
      var cont=this.add.container(c*(RW+GAP)+RW/2, -GH.pos[c]*CH);
      var n=3*GH.STRIPLEN+3;
      for(var k=0;k<n;k++){
        var key=GH.strips[c][k%GH.STRIPLEN];
        var sp=this.add.image(0,k*CH,SYM[key].tex).setDisplaySize(TILE,TILE);
        cont.add(sp);
      }
      cont.setMask(mask);
      GH.reelCont.push(cont);
      var antic=this.add.image(c*(RW+GAP)+RW/2,SCENE_H/2,'anticFrame').setDepth(10).setAlpha(0);
      GH.anticFx.push(antic);
      var cresc=this.add.image(c*(RW+GAP)+RW/2,SCENE_H/2,'crescFrame').setDepth(11).setAlpha(0);
      GH.crescFx.push(cresc);
    }
    GH.lineGfx=this.add.graphics().setDepth(8);
    GH.winFx=[];
    updateUI();
  },
  drawWinLines:function(wins){
    var t=GH.main, g=GH.lineGfx; g.clear();
    wins.forEach(function(w){
      var pts=w.cells.map(function(cell){ return new Phaser.Geom.Point(cell.c*(RW+GAP)+RW/2, cell.r*CH+CH/2) });
      g.lineStyle(4,0xffd166,0.9);
      g.strokePoints(pts,false,true);
      w.cells.forEach(function(cell){
        var fx=t.add.image(cell.c*(RW+GAP)+RW/2, cell.r*CH+CH/2,'winFrame').setDepth(9).setAlpha(0.95);
        t.tweens.add({targets:fx,alpha:0.35,duration:280,yoyo:true,repeat:3});
        GH.winFx.push(fx);
      });
    });
  },
  clearWin:function(){
    GH.lineGfx.clear();
    GH.winFx.forEach(function(f){f.destroy()}); GH.winFx=[];
  },
  pulse:function(idx,which){
    var sp=(which==='cresc'?GH.crescFx:GH.anticFx)[idx];
    sp.setAlpha(1);
    GH.pulseTweens[idx]=this.tweens.add({targets:sp,alpha:0.25,duration:which==='cresc'?160:300,yoyo:true,repeat:-1});
  },
  stopPulse:function(idx){
    if(GH.pulseTweens[idx]){GH.pulseTweens[idx].remove();GH.pulseTweens[idx]=null}
    GH.anticFx[idx].setAlpha(0); GH.crescFx[idx].setAlpha(0);
  }
};

/* ── spin flow ── */
function spin(){
  if(GH.state.spinning||spinLock)return;
  if(GH.state.fs===0&&GH.state.bal<GH.state.bet){el.brokeOverlay.classList.add('show');return}
  GH.audio.ac(); GH.startMusic(); GH.buzz('spin');
  GH.state.spinning=true; GH.main.clearWin();
  el.banner.className='banner'; el.soclose.classList.remove('show');
  var inFS=GH.state.fs>0;
  if(!inFS){GH.state.bal-=GH.state.bet}
  if(inFS)GH.state.fs--;
  GH.state.spins++; GH.state.sinceGift++;
  CFG.jackpots.levels.forEach(function(l){GH.jack[l.key]+=GH.state.bet*l.growth});
  GH.audio.spin();
  var pl=GH.plan();
  var targets=[]; for(var c=0;c<RC;c++)targets.push(GH.targetFor(c,pl,GH.strips));
  var dur=CFG.reels.spinDurations.slice();
  if(GH.state.turbo)dur=dur.map(function(d){return d*CFG.reels.turboFactor});

  var sus=CFG.suspense.enabled?GH.detect(GH.gridFrom(targets,GH.strips),pl):null;
  if(sus){
    var extra=GH.state.turbo?CFG.suspense.revealMs*CFG.reels.turboFactor:CFG.suspense.revealMs;
    dur[RC-1]=Math.max(dur[RC-1],dur[RC-2]+extra);
    GH.main.pulse(RC-1,'cresc');
    var s0=dur[RC-2],span=dur[RC-1]-s0,steps=CFG.suspense.steps;
    for(var k=0;k<steps;k++){
      (function(kk){setTimeout(function(){
        GH.audio.suspense(kk,steps,sus);
        var p=kk/(steps-1);
        GH.buzz(p<0.4?'suspense':(p<0.8?'suspenseMid':'suspenseHi'));
      },s0+span*Math.pow((kk+1)/steps,1.8))})(k);
    }
  }else if(pl.mode!=='normal'){
    dur[RC-1]+=GH.state.turbo?CFG.reels.anticipationExtra*CFG.reels.turboFactor:CFG.reels.anticipationExtra;
    GH.main.pulse(RC-1,'antic');
    setTimeout(function(){GH.audio.heart();GH.buzz('anticipation');setTimeout(function(){GH.audio.heart();GH.buzz('anticipation')},400)},dur[RC-1]-700);
  }

  var done=0;
  GH.reelCont.forEach(function(cont,i){
    var cur=GH.pos[i];
    var delta=((targets[i]-cur)%GH.STRIPLEN+GH.STRIPLEN)%GH.STRIPLEN;
    var dist=GH.STRIPLEN*2+delta;
    GH.pos[i]=cur+dist;
    GH.main.tweens.add({targets:cont, y:-GH.pos[i]*CH, duration:dur[i], ease:'Cubic.Out',
      onComplete:function(){
        GH.audio.stop(); GH.buzz(i===RC-1?'lastReel':'reelStop');
        done++;
        if(done===RC){
          GH.reelCont.forEach(function(ct,ci){ GH.pos[ci]%=GH.STRIPLEN; ct.y=-GH.pos[ci]*CH; });
          GH.main.stopPulse(RC-1);
          resolveSpin(pl,inFS);
        }
      }});
  });
}

function celebrate(win,res){
  var ratio=win/GH.state.bet, tier=null;
  for(var i=0;i<CFG.celebrations.tiers.length;i++){if(ratio>=CFG.celebrations.tiers[i].minRatio){tier=CFG.celebrations.tiers[i];break}}
  if(!tier)return;
  GH.main.drawWinLines(res.lines);
  GH.buzz(tier.buzz);
  switch(tier.fx){
    case 'monumental':GH.audio.fanfare();shake();rain(160);bigCelebration(tier.text,win);break;
    case 'mega':GH.audio.big();shake();centerBurst(120);showBanner(tier.text,win,'gold');break;
    case 'big':GH.audio.big();centerBurst(70);showBanner(tier.text,win,'gold');break;
    case 'nice':GH.audio.nice();centerBurst(30);showBanner(tier.text,win,'cyan');break;
    case 'small':GH.audio.win();showBanner(tier.text,win,'cyan');break;
    case 'ldw':GH.audio.coin();centerBurst(14);showBanner(tier.text,win,'cyan');break;
  }
  setTimeout(fxKick,10);
}
function bigCelebration(text,win){
  showBanner(text,win,'gold');
  var n=0,iv=setInterval(function(){centerBurst(25);GH.audio.coin();GH.buzz('coin');if(++n>6)clearInterval(iv)},280);
  setTimeout(function(){rain(120)},600);
}

function resolveSpin(pl,inFS){
  var res=GH.evaluate(GH.gridFrom(GH.pos,GH.strips));
  var mult=GH.LADDER[Math.min(Math.max(GH.state.streak,0),GH.LADDER.length-1)];
  var fsM=inFS?GH.state.fsMult:1;
  var win=res.total*mult*fsM;
  if(win>=GH.state.bet)GH.state.streak++;else if(win===0)GH.state.streak=0;
  GH.state.bal+=win; GH.state.lastWin=win;
  if(win>GH.state.biggest)GH.state.biggest=win;
  GH.state.hype=Math.min(CFG.hype.max,GH.state.hype+CFG.hype.perSpin+(win>0?CFG.hype.perWin:0));

  if(win>0)celebrate(win,res);
  else if(pl.mode!=='normal'&&GH.curTease()){
    GH.audio.wah();shake();GH.buzz('nearMiss');
    el.soclose.querySelector('span').textContent=GH.curTease().banner;
    el.soclose.classList.add('show');
    setTimeout(function(){el.soclose.classList.remove('show')},2000);
  }
  if(pl.mode==='hype'){GH.state.hype=0;toast(CFG.hype.celebrate)}

  var fsTier=null;for(var i=0;i<CFG.freeSpins.tiers.length;i++){if(res.scatters>=CFG.freeSpins.tiers[i].minCount){fsTier=CFG.freeSpins.tiers[i];break}}
  if(fsTier&&!res.wheel){
    if(inFS||GH.state.fs>0){
      GH.state.fs+=fsTier.spins;if(fsTier.mult>GH.state.fsMult)GH.state.fsMult=fsTier.mult;
      toast('⛵ Retrigger! +'+fsTier.spins+' free spins');
    }else{
      GH.state.pendingBonus=GH.state.pendingBonus||res.stars>=CFG.bonus.minCount;
      setTimeout(function(){startFS(fsTier)},win>0?1600:400);
    }
  }else if(res.stars>=CFG.bonus.minCount&&!res.wheel){
    if(GH.state.fs>0){GH.state.pendingBonus=true;toast('⭐ Bonus game queued for after free spins')}
    else setTimeout(openDoors,win>0?1600:600);
  }

  if(GH.state.fs>0){setTimeout(function(){if(GH.state.fs>0&&!GH.state.spinning)spin()},win>0?1900:900)}
  else if(inFS){toast(CFG.freeSpins.endToast)}

  GH.state.spinning=false;
  updateUI();
  if(GH.state.auto&&!spinLock){
    if(GH.state.fs===0&&GH.state.bal<GH.state.bet){GH.state.auto=false;el.autoBtn.classList.remove('on');toast('Autoplay stopped — out of credits')}
    else setTimeout(function(){if(GH.state.auto&&!GH.state.spinning)spin()},win>0?1400:600);
  }
  if(GH.state.fs===0&&GH.state.bal<GH.state.bet)setTimeout(function(){if(GH.state.bal<GH.state.bet)el.brokeOverlay.classList.add('show')},800);
}

function showWheel(){
  spinLock=true; GH.buzz('bonus');
  el.wheelOverlay.classList.add('show');
  el.wheel.innerHTML='';
  var cols=[CFG.colors.cyan,CFG.colors.pink,CFG.colors.gold];
  CFG.jackpots.levels.forEach(function(l,i){
    var a=document.createElement('div'); a.className='seg';
    a.style.transform='rotate('+(i*120-90)+'deg) translate(60px,-50%)';
    a.style.color=cols[i]; a.style.textShadow='0 0 8px '+cols[i];

  el.wheel.style.transition='none'; el.wheel.style.transform='rotate(0deg)';
  void el.wheel.offsetWidth;
  var r=Math.random(),acc=0,k=0;

  GH.audio.heart(); setTimeout(function(){GH.audio.heart();GH.buzz('anticipation')},700); setTimeout(function(){GH.audio.heart();GH.buzz('anticipation')},1400);
  setTimeout(function(){
    var lvl=CFG.jackpots.levels[k], prize=GH.jack[lvl.key];
    award(prize); GH.jack[lvl.key]=lvl.start;
    GH.audio.fanfare(); rain(200); fxKick(); shake(); GH.buzz('wheel');

function coinVal(){
  var x=Math.random();
  for(var i=0;i<V.coinTable.length;i++){
    var c=V.coinTable[i]; x-=c.chance;
    if(x<=0)return c.v!==undefined?{e:c.emoji,v:c.v}:{e:c.emoji,v:c.min+Math.floor(Math.random()*(c.max-c.min+1))};
  }
  var last=V.coinTable[V.coinTable.length-1];
  return{e:last.emoji,v:last.v||last.min};
}
function startVault(){
  spinLock=true; GH.buzz('bonus');
  el.vaultOverlay.classList.add('show');
  el.vgrid.innerHTML=''; el.vaultTotal.textContent=''; el.vaultDone.style.display='none';
  var totalCells=V.gridCols*V.gridRows, cells=[], filled=0, total=0;
  for(var i=0;i<totalCells;i++){var c=document.createElement('div');c.className='vcell tile';el.vgrid.appendChild(c);cells.push(c)}
  el.vgrid.style.gridTemplateColumns='repeat('+V.gridCols+',54px)';
  var idxs=[]; for(var j=0;j<totalCells;j++)idxs.push(j);
  for(var j2=0;j2<V.initialCoins;j2++){
    var p=idxs.splice(Math.floor(Math.random()*idxs.length),1)[0];
    var cv=coinVal(); cells[p].classList.add('coin'); cells[p].innerHTML=cv.e+'<span class="cv">×'+cv.v+'</span>'; total+=cv.v; filled++;
  }
  var spins=V.spins; el.vaultInfo.textContent=spins+' spins';
  GH.audio.coin(); GH.buzz('coin');
  function round(){
    var landed=0;
    cells.forEach(function(c){if(!c.classList.contains('coin')&&Math.random()<V.landChance){var cv=coinVal();c.classList.add('coin');c.innerHTML=cv.e+'<span class="cv">×'+cv.v+'</span>';total+=cv.v;filled++;landed++}});
    if(landed>0){spins=V.spins;GH.audio.coin();GH.buzz('coin');if(landed>2)GH.audio.nice()}
    else{spins--;GH.audio.tick()}
    el.vaultInfo.textContent=spins+' spins';
    if(filled>=totalCells||spins<=0){
      var bonus=0;
      if(filled>=totalCells){bonus=V.fullBoardBonus;GH.audio.fanfare();rain(140);fxKick();shake();GH.buzz('monumental')}
      var win=(total+bonus)*GH.state.bet;
      el.vaultTotal.textContent=(bonus?'FULL BOARD! +'+bonus+'× · ':'')+'Total ×'+(total+bonus)+' = +$'+fmt(win);
      el.vaultInfo.textContent='Vault sealed';
      award(win); GH.audio.big(); centerBurst(60);
      el.vaultDone.style.display='inline-block';
    }else setTimeout(round,V.roundDelay);
  }
  setTimeout(round,V.roundDelay+100);
}
el.vaultDone.addEventListener('click',function(){GH.audio.coin();GH.buzz('coin');resumeFromBonus()});

function startArena(){
  spinLock=true; GH.buzz('bonus');
  el.arenaOverlay.classList.add('show');
  el.arenaInfo.textContent='Pick '+A.picks; el.arenaTotal.textContent=''; el.arenaDone.style.display='none';
  el.agrid.innerHTML='';
  var prizes=A.prizes.slice();
  for(var i=prizes.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=prizes[i];prizes[i]=prizes[j];prizes[j]=t}
  var picks=A.picks, total=0;
  prizes.forEach(function(p){
    var b=document.createElement('button'); b.className='atile tile'; b.textContent=A.closedEmoji;
    b.addEventListener('click',function(){
      if(b.classList.contains('open')||picks<=0)return;
      b.classList.add('open');
      if(p.steal){b.innerHTML=p.emoji+'<span class="av">'+A.stealText+'</span>';picks--;GH.audio.wah();shake();GH.buzz('nearMiss')}
      else{total+=p.mult;b.innerHTML=p.emoji+'<span class="av">+$'+fmt(p.mult*GH.state.bet)+'</span>';picks--;GH.audio.coin();GH.buzz('coin')}
      el.arenaInfo.textContent=picks>0?('Pick '+picks+(picks===1?'':' more')):'';
      if(picks<=0){
        var win=total*GH.state.bet;
        el.arenaTotal.textContent='Haul: +$'+fmt(win);
        award(win); GH.audio.big(); centerBurst(50); GH.buzz('bigWin'); el.arenaDone.style.display='inline-block';
      }
    });
    el.agrid.appendChild(b);
  });
}
el.arenaDone.addEventListener('click',function(){GH.audio.coin();GH.buzz('coin');resumeFromBonus()});

var mStep=-1,mTimer=null,mOver=false;
function startMoonshot(){
  spinLock=true; mOver=false; mStep=-1; GH.buzz('bonus');
  el.moonOverlay.classList.add('show');
  el.moonResult.textContent='';
  el.mpath.querySelectorAll('.mnode').forEach(function(n){n.remove()});
  M.nodes.forEach(function(m){var n=document.createElement('div');n.className='mnode';n.textContent='×'+m;el.mpath.appendChild(n)});
  el.mrocket.classList.remove('crash');
  el.cashBtn.disabled=true; el.cashBtn.textContent=M.cashLabel.replace('{m}',M.nodes[0]);
  GH.audio.big();
  setTimeout(function(){
    var nodes=el.mpath.querySelectorAll('.mnode');
    el.mrocket.style.left=(nodes[0].offsetLeft+nodes[0].offsetWidth/2-16)+'px';
  },60);
  mTimer=setTimeout(advanceMoon,M.startDelay);
}
function advanceMoon(){
  if(mOver)return;
  mStep++;
  var nodes=el.mpath.querySelectorAll('.mnode');
  nodes.forEach(function(n,i){n.className='mnode'+(i<mStep?' done':i===mStep?' cur':'')});
  el.mrocket.style.left=(nodes[mStep].offsetLeft+nodes[mStep].offsetWidth/2-16)+'px';
  GH.audio.rise(mStep); GH.buzz('step');
  if(Math.random()<M.crashProb[mStep]){
    mOver=true; nodes[mStep].classList.add('dead');
    setTimeout(function(){
      el.mrocket.classList.add('crash'); GH.audio.wah(); shake(); GH.buzz('crash');
      var safe=mStep>0?M.nodes[mStep-1]:M.consolation, win=safe*GH.state.bet;
      award(win);
      el.moonResult.textContent=M.crashText.replace('{m}',M.nodes[mStep]).replace('{w}','$'+fmt(win)).replace('{s}',safe);
      el.cashBtn.disabled=true;
      setTimeout(resumeFromBonus,2800);
    },600);
  }else{
    el.cashBtn.disabled=false; el.cashBtn.textContent=M.cashLabel.replace('{m}',M.nodes[mStep]);
    if(mStep<M.nodes.length-1)mTimer=setTimeout(advanceMoon,M.stepDelay);
    else{
      mOver=true;
      setTimeout(function(){
        var win=M.nodes[M.nodes.length-1]*GH.state.bet;
        award(win); GH.audio.fanfare(); rain(160); fxKick(); GH.buzz('monumental');
        el.moonResult.textContent=M.perfectText.replace('{m}',M.nodes[M.nodes.length-1]).replace('{w}','$'+fmt(win));
        el.cashBtn.disabled=true;
        setTimeout(resumeFromBonus,3000);
      },700);
    }
  }
}
el.cashBtn.addEventListener('click',function(){
  if(el.cashBtn.disabled||mOver)return;
  mOver=true; clearTimeout(mTimer);
  var win=M.nodes[mStep]*GH.state.bet;
  award(win); GH.audio.fanfare(); centerBurst(90); GH.buzz('cash');
  el.moonResult.textContent=M.cashText.replace('{m}',M.nodes[mStep]).replace('{w}','$'+fmt(win));
  el.cashBtn.disabled=true;
  setTimeout(resumeFromBonus,2400);
});

/* ── controls ── */
el.spinBtn.addEventListener('click',function(){
  if(GH.state.auto){GH.state.auto=false;el.autoBtn.classList.remove('on')}
  spin();
});
el.betUp.addEventListener('click',function(){if(GH.state.spinning||GH.state.fs>0)return;GH.state.bet=Math.min(CFG.economy.betMax,GH.state.bet+CFG.economy.betStep);updateUI()});
el.betDown.addEventListener('click',function(){if(GH.state.spinning||GH.state.fs>0)return;GH.state.bet=Math.max(CFG.economy.betMin,GH.state.bet-CFG.economy.betStep);updateUI()});
el.turboBtn.addEventListener('click',function(){GH.state.turbo=!GH.state.turbo;el.turboBtn.classList.toggle('on',GH.state.turbo)});
el.autoBtn.addEventListener('click',function(){
  GH.state.auto=!GH.state.auto; el.autoBtn.classList.toggle('on',GH.state.auto);
  if(GH.state.auto&&!GH.state.spinning&&!spinLock){if(GH.state.fs===0&&GH.state.bal<GH.state.bet){GH.state.auto=false;el.autoBtn.classList.remove('on')}else spin()}
});
el.menuBtn.addEventListener('click',function(){el.payOverlay.classList.add('show')});
el.payClose.addEventListener('click',function(){el.payOverlay.classList.remove('show')});

var fitEl=document.getElementById('dhx'), fitW=0, fitH=0;
function fitScreen(){
  if(!fitW){ fitW=fitEl.offsetWidth; fitH=fitEl.offsetHeight; }
  var s=Math.min(1,(window.innerWidth-10)/fitW,(window.innerHeight-10)/fitH);
  fitEl.style.zoom=s;
}
window.addEventListener('resize',fitScreen);
window.addEventListener('orientationchange',function(){setTimeout(fitScreen,250)});
